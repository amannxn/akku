<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b20"><title>For Akansha — Designed by Aman</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;600;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120b20;color:#fff3e7;font-family:'DM Sans',sans-serif}
#world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 76%,#71364e,#301a3a 42%,#120b20 82%)}
#sky{position:absolute;inset:0;width:100%;height:100%}.moon{position:absolute;right:13%;top:12%;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9db,#f3c47f 65%,#dc8b83);box-shadow:0 0 55px #f6c98a99}.moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:#1b1028;transform:translate(17px,-8px)}
header{position:absolute;top:7%;width:100%;text-align:center;padding:0 15px;text-shadow:0 3px 24px #090510}.kicker{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#f5c9a8}h1{font:600 clamp(42px,8vw,76px)/.95 'Cormorant Garamond',serif;color:#ffe0a3;margin:12px 0 8px}header p{font-size:12px;letter-spacing:1px;color:#f7dce0;margin:0}
.town{position:absolute;bottom:19%;left:0;width:100%;height:35%;display:flex;align-items:end;justify-content:space-between;padding:0 2%}.house{position:relative;width:25%;height:85%;max-width:245px;filter:drop-shadow(0 15px 20px #08051188)}.house .body{position:absolute;bottom:0;width:100%;height:72%;background:linear-gradient(145deg,#80445d,#3c2448);border:1px solid #e8ad8b66}.house.alt .body{background:linear-gradient(145deg,#a75d48,#512a4d)}.roof{position:absolute;bottom:70%;left:-7%;width:114%;height:30%;background:linear-gradient(135deg,#d58a59,#7b3d51);clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;bottom:0;left:39%;width:23%;height:48%;background:#48253d;border:2px solid #d89c70;border-bottom:0;border-radius:45% 45% 0 0}.window{position:absolute;bottom:43%;width:19%;height:22%;background:#ffcc78;box-shadow:0 0 20px #ffbb62aa;border:4px solid #65324c}.one{left:10%}.two{right:10%}.garland{position:absolute;left:7%;right:7%;top:19%;height:23%;border-bottom:2px solid #e7aa6a;border-radius:0 0 50% 50%}.garland:after{content:"✦ ✦ ✦ ✦ ✦";position:absolute;top:20px;width:100%;text-align:center;color:#ffcf76;font-size:12px;letter-spacing:8px}
.street{position:absolute;bottom:0;left:-10%;width:120%;height:25%;background:linear-gradient(#59334e,#1a122b);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}.path{position:absolute;bottom:0;left:50%;width:34%;height:23%;transform:translateX(-50%);background:linear-gradient(#89556b,#3a2347);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.rangoli{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);width:145px;height:72px;border:2px solid #f0b96d;border-radius:50%;box-shadow:0 0 0 7px #d46f9166,0 0 0 13px #f5c16b44}.rangoli:after{content:"✿";position:absolute;inset:0;display:grid;place-items:center;color:#ffe1a0;font-size:44px}
.lamp{position:absolute;bottom:13%;width:32px;height:15px;border-radius:0 0 50% 50%;background:linear-gradient(#f5bd69,#a84c3b);box-shadow:0 5px 12px #08051188}.lamp:before{content:"";position:absolute;left:12px;top:-18px;width:9px;height:21px;background:radial-gradient(ellipse at 50% 75%,#fff8b7,#ffbd52 35%,#ff6d45 65%,transparent 72%);filter:drop-shadow(0 0 9px #ff9d48);animation:flicker .8s infinite alternate}.l1{left:27%}.l2{left:36%;bottom:9%}.l3{right:27%}.l4{right:36%;bottom:9%}@keyframes flicker{to{transform:scale(1.1) rotate(4deg)}}
.couple{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);display:flex;align-items:end;gap:5px;filter:drop-shadow(0 9px 10px #0b0615aa)}.person{position:relative;width:55px;height:120px;transform-origin:bottom}.head{position:absolute;top:0;left:13px;width:30px;height:33px;border-radius:48%;background:#b8795c;z-index:2}.hair{position:absolute;top:-3px;left:11px;width:34px;height:22px;border-radius:50% 50% 25% 25%;background:#201321;z-index:3}.torso{position:absolute;top:30px;left:4px;width:48px;height:60px;border-radius:16px 16px 8px 8px;background:linear-gradient(135deg,#e7a0b0,#9b456d)}.him .torso{background:linear-gradient(135deg,#e8b56e,#9d4d45)}.skirt{position:absolute;top:78px;left:0;width:56px;height:40px;background:#8e416d;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.him .skirt{background:#35243e}.arm{position:absolute;top:40px;left:0;width:10px;height:48px;border-radius:8px;background:#b8795c;transform:rotate(18deg)}.arm.right{left:43px;transform:rotate(-25deg)}.couple.walk{animation:walk 2s ease-in-out infinite alternate}@keyframes walk{to{transform:translate(-50%,-9px)}}
.petal{position:absolute;top:-20px;width:8px;height:12px;border-radius:80% 0 80% 0;background:#e98ba7;opacity:.65;animation:fall linear infinite}@keyframes fall{to{transform:translate(80px,110vh) rotate(650deg)}}.spark{position:absolute;pointer-events:none;font-size:24px;animation:pop 1.7s ease-out forwards}@keyframes pop{0%{opacity:0;transform:scale(.2)}20%{opacity:1}100%{opacity:0;transform:scale(3) translateY(-35px)}}
.actions{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:0;width:100%;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px;z-index:5}button{border:1px solid #f4d4b366;background:#1e122bd9;color:#fff3e5;border-radius:30px;padding:11px 15px;font:600 12px 'DM Sans';backdrop-filter:blur(12px);cursor:pointer}button:active{transform:scale(.96)}button.gold{background:linear-gradient(135deg,#f6c878,#d88765);border:0;color:#281529}
.card,.intro{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#10091dcc;z-index:10;opacity:0;visibility:hidden;transition:.35s}.card.show,.intro.show{opacity:1;visibility:visible}.panel{width:min(430px,100%);padding:28px 25px;text-align:center;border:1px solid #f4d5a255;border-radius:28px;background:linear-gradient(145deg,#321a36,#130d24);box-shadow:0 25px 90px #05030c99}.panel h2{font:600 39px 'Cormorant Garamond';color:#ffdda2;margin:8px 0}.panel p{font:500 18px/1.55 'Cormorant Garamond';color:#f8e7df}.panel input{display:block;width:100%;margin:9px 0;padding:13px 14px;border-radius:12px;border:1px solid #ffffff35;background:#ffffff0d;color:white;font:14px 'DM Sans'}.panel input::placeholder{color:#c7b3c0}.tiny{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#d7aebd}.intro{z-index:20;opacity:1;visibility:visible;background:radial-gradient(ellipse at 50% 70%,#67364d,#140d25 70%)}#hint{position:fixed;top:17px;left:50%;transform:translateX(-50%);z-index:7;padding:9px 15px;border-radius:22px;background:#1a1028d9;border:1px solid #fff2;color:#ffe9d4;font-size:11px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
@media(max-width:560px){.moon{width:62px;height:62px}.town{height:29%;bottom:22%;padding:0}.house{width:29%;height:75%}.couple{bottom:17%;transform:translateX(-50%) scale(.85)}.couple.walk{animation:walkSmall 2s ease-in-out infinite alternate}@keyframes walkSmall{to{transform:translate(-50%,-9px) scale(.85)}}.rangoli{bottom:13%;width:120px}.l1{left:20%}.l3{right:20%}.actions{gap:6px}.actions button{padding:10px 12px;font-size:11px}}
</style></head><body>
<div id="world"><canvas id="sky"></canvas><div class="moon"></div>
<header><div class="kicker">designed by aman for akansha</div><h1>For Akansha</h1><p>somewhere between the stars and the diyas ✨</p></header>
<div class="town"><div class="house"><div class="roof"></div><div class="body"></div><div class="door"></div><div class="window one"></div><div class="window two"></div><div class="garland"></div></div><div class="house alt"><div class="roof"></div><div class="body"></div><div class="door"></div><div class="window one"></div><div class="window two"></div><div class="garland"></div></div></div>
<div class="street"></div><div class="path"></div><div class="rangoli"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div class="lamp l4"></div>
<div class="couple" id="couple"><div class="person him"><div class="hair"></div><div class="head"></div><div class="torso"></div><div class="skirt"></div><div class="arm"></div><div class="arm right"></div></div><div class="person"><div class="hair"></div><div class="head"></div><div class="torso"></div><div class="skirt"></div><div class="arm"></div><div class="arm right"></div></div></div></div>
<div id="hint"></div><div class="actions"><button onclick="walk()">♡ Walk together</button><button onclick="light()">🪔 Light a diya</button><button onclick="wish()">✨ Make a wish</button><button onclick="ring()">🔔 Ring the bell</button><button class="gold" onclick="skyshot()">🎆 Skyshot</button></div>
<div class="card" id="card"><div style="font-size:35px" id="emoji">💌</div><div class="tiny" id="kicker">just for you</div><h2 id="title">A little note</h2><p id="body"></p><button class="gold" onclick="closeCard()">Keep exploring ♡</button></div>

<script>
const $=id=>document.getElementById(id);let lit=0,walking=false,audio;
function hint(s){$('hint').textContent=s;$('hint').style.opacity=1;clearTimeout(window.ht);window.ht=setTimeout(()=>$('hint').style.opacity=0,2600)}
function chime(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let t=audio.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.04,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.48);o.start(t+i*.09);o.stop(t+i*.09+.5)})}catch(e){}}
function show(e,k,t,b){$('emoji').textContent=e;$('kicker').textContent=k;$('title').textContent=t;$('body').textContent=b;$('card').classList.add('show');chime()}
function closeCard(){$('card').classList.remove('show')}
function walk(){walking=!walking;$('couple').classList.toggle('walk',walking);hint(walking?'A little walk under the lights, together ♡':'Let’s pause and enjoy the evening');chime()}
function light(){lit++;let d=document.createElement('div');d.className='lamp';d.style.left=(15+Math.random()*70)+'%';d.style.bottom=(12+Math.random()*13)+'%';$('world').appendChild(d);hint('You added a little more light to the night 🪔');chime();if(lit===3)show('🌟','a tiny thought','Look at all this light','Funny how one small flame can change a whole room. Some people do that too.')}
function burst(){for(let i=0;i<9;i++){let s=document.createElement('div');s.className='spark';s.textContent=['✦','✧','✺','✨','❋'][Math.floor(Math.random()*5)];s.style.left=(10+Math.random()*80)+'%';s.style.top=(12+Math.random()*40)+'%';s.style.color=['#ffdc8c','#f7a9b9','#fff0ce','#dca8ef'][Math.floor(Math.random()*4)];$('world').appendChild(s);setTimeout(()=>s.remove(),1800)}}
function wish(){burst();let a=['May the days ahead feel softer and brighter.','May we collect more little moments like this.','May every new beginning bring a reason to smile.','May your heart always feel safe, seen and loved.'];show('✨','close your eyes for a second','Make a little wish',a[Math.floor(Math.random()*a.length)])}
function ring(){burst();hint('Ding dong! The evening’s favourite person is here 🔔');chime()}
function skyshot(){burst();hint('A little skyshot, just for you 🎆');chime();setTimeout(()=>show('💌','designed by aman for akansha','Hey my love','Hey my love , i prepared this a long ago , idk if m alive or not , but i miss you , and I love you so so so much , HAPPY DIWALI MY LOVE , I wish I could see you in those traditionals , VC you and celebrate this diwali , Unfortunately m just an unlucky brat , anyways I LOVE YOU , AND WILL ALWAYS .'),2200)}
const c=$('sky'),x=c.getContext('2d');let stars=[];function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:110},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight*.65,r:Math.random()*1.4+.3,p:Math.random()*6}))}
function draw(t){x.clearRect(0,0,innerWidth,innerHeight);stars.forEach(s=>{x.fillStyle='rgba(255,232,190,'+(.25+.55*(.5+.5*Math.sin(t*.001+s.p)))+')';x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill()});requestAnimationFrame(draw)}size();addEventListener('resize',size);requestAnimationFrame(draw);
for(let i=0;i<18;i++){let p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'%';p.style.animationDuration=(9+Math.random()*13)+'s';p.style.animationDelay=(-Math.random()*18)+'s';$('world').appendChild(p)}
</script></body></html>
